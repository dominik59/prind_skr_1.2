# Build firmware for STM32F103 with a 28 KiB bootloader and USB communication.
# PC13 must initialize low so USB remains available after the MCU starts.
#
# This board's thermistor inputs can be inaccurate, so heater limits and PID
# values must be validated against the installed sensors and hotend.

[include mainsail.cfg]
[include Macros.cfg]

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_min: 0
position_endstop: 0
position_max: 233
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PB15
run_current: 0.600
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_min: -12
position_endstop: -12
position_max: 233
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC6
run_current: 0.610
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 215

homing_speed: 5
second_homing_speed: 5
homing_retract_speed: 10
homing_retract_dist: 5

[tmc2209 stepper_z]
uart_pin: PC10
run_current: 0.900
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 7.710843373493976
pressure_advance: 0.13
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA0
control: pid
pid_Kp: 25.246
pid_Ki: 1.079
pid_Kd: 147.690
min_temp: 0
max_temp: 270
min_extrude_temp: 170

[tmc2209 extruder]
uart_pin: PC11
run_current: 0.700
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: pid
pid_Kp: 67.594
pid_Ki: 1.198
pid_Kd: 953.078
min_temp: 0
max_temp: 130

[fan]
pin: PA8

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD7054246383412640557-if00

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000
max_z_velocity: 40
max_z_accel: 100

[input_shaper]
shaper_freq_x: 44.7828
shaper_freq_y: 50.505
shaper_type: 2hump_ei

[static_digital_output usb_pullup_enable]
pins: !PC13

[board_pins]
aliases:
    # Aliases keep display and beeper wiring independent of raw MCU pin names.
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PB6, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7, EXP1_10=<5V>

[bltouch]
sensor_pin: ^PC2
control_pin: PA1
x_offset: 59
y_offset: -1
#z_offset: 0.985
pin_move_time: 0.680
lift_speed: 10
speed: 5
samples: 5
samples_tolerance: 0.025
# High retry count is required because this probe hardware intermittently exceeds tolerance.
samples_tolerance_retries: 300
samples_result: median

[screws_tilt_adjust]
screw1: 1, 33
screw1_name: front left screw
screw2: 141, 33
screw2_name: front right screw
screw3: 141, 203
screw3_name: rear right screw
screw4: 1, 203
screw4_name: rear left screw
screw_thread: CW-M4

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 60, 21
mesh_max: 215, 214
probe_count: 9, 9
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.2
fade_start: 1
fade_end: 10

[safe_z_home]
home_xy_position: 56, 118
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 25

[axis_twist_compensation]
speed: 50
horizontal_move_z: 5

# X-axis calibration range
calibrate_start_x: 60
calibrate_end_x: 215
calibrate_y: 117.5

# Y-axis calibration range
calibrate_start_y: 21
calibrate_end_y: 214
calibrate_x: 137.5

[mesh_plane]
x_adjust: -0.000260
y_adjust: -0.000544
z_adjust: 0.000000

x_reference: 116.5
y_reference: 110.5

residual_min: 10, 10
residual_max: 223, 223

residual_x_count: 3
residual_y_count: 3

residual_start_z: 2.0
residual_travel_z: 5.0
residual_travel_speed: 50.0
residual_z_speed: 5.0
manual_probe_speed: 5.0

[respond]

[exclude_object]

