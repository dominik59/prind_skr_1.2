# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v1.2. To use this config, the firmware should be compiled for the
# STM32F103 with a "28KiB bootloader" and USB communication. Also,
# select "Enable extra low-level configuration options" and configure
# "GPIO pins to set at micro-controller startup" to "!PC13".

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

# Note: This board has a design flaw in its thermistor circuits that
# cause inaccurate temperatures (most noticeable at low temperatures).

# rotation_distance = <full_steps_per_rotation> * <microsteps> / <steps_per_mm>
# Let’s take the popular BMG Extruder which has an E step value of 415 when combined
# with a regular 1.8-degree stepper motor and the stepper driver is set to 16 microsteps.
# This translates into a rotation distance of 7.710843373493976.
# Ender 3 pro has 1.8 degree motors so 200 is full_steps_per_rotation

[include mainsail.cfg]
[include Macros.cfg]

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_min: 0
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PB15
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
 
[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC6
run_current: 0.580
hold_current: 0.500
stealthchop_threshold: 999999
 
[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 250

[tmc2209 stepper_z]
uart_pin: PC10
run_current: 0.580
hold_current: 0.500
#stealthchop_threshold: 5
 
[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD2
microsteps: 16
rotation_distance: 7.710843373493976
pressure_advance: 0.45 #pressure_advance: 0.503
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: ATC Semitec 104GT-2
sensor_pin: PA0
control: pid
pid_Kp: 24.194
pid_Ki: 1.002
pid_Kd: 146.070
min_temp: 0
max_temp: 250
min_extrude_temp: 170

[tmc2209 extruder]
uart_pin: PC11
run_current: 0.650
hold_current: 0.500
#stealthchop_threshold: 5
 
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC3
control: pid
pid_Kp: 67.594
pid_Ki: 1.198
pid_Kd: 953.078
min_temp: 0
max_temp: 130

[fan]
pin: PA8

# To get mcu you need to run ls /dev/serial/by-id/* after plug in printer
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f103xe_37FFD7054246383412640557-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 6500
max_z_velocity: 5
max_z_accel: 100

[input_shaper]
shaper_freq_x: 44.7828 #56.1511
shaper_freq_y: 50.505  #46.4415
shaper_type: 2hump_ei

[static_digital_output usb_pullup_enable]
pins: !PC13

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5, EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PB6, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PB7, EXP1_10=<5V>
 
[bltouch]
sensor_pin: ^PC2
control_pin: PA1
x_offset: -38.5
y_offset: -12
z_offset: 2.66 #0.505 #0.625 # measured z_offset: 0.960
pin_move_time: 0.4
lift_speed: 10
speed: 5
samples: 5
samples_tolerance: 0.0225
samples_tolerance_retries: 20
samples_result: average

[screws_tilt_adjust]
screw1: 76,41
screw1_name: front left screw
screw2: 235, 41
screw2_name: front right screw
screw3: 235, 211
screw3_name: rear right screw
screw4: 76,211
screw4_name: rear left screw
screw_thread: CW-M4
 
[bed_mesh]
speed: 120
horizontal_move_z: 10
mesh_min: 10,17
mesh_max: 174,213
probe_count: 4,4
fade_start: 1
fade_end: 10
fade_target: 0
algorithm: bicubic
 
[safe_z_home]
home_xy_position: 147,112
speed: 80.0
z_hop: 10.0
z_hop_speed: 10.0
 
[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2
#kill_pin: ^!EXP2_8
 
[output_pin beeper]
pin: EXP1_1
 
