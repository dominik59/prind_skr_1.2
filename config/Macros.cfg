#####################################################################
# Macros
#####################################################################

[gcode_macro G29]
description: Heat the printer and create the saved mybedmesh profile
gcode:
  BED_MESH_CALIBRATE {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
description: Create mybedmesh after the printer reaches calibration temperature
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set probe_temp = params.PROBE_TEMP|default(150)|float %}

  M140 S{bed_temp}
  M104 S{probe_temp}
  M190 S{bed_temp}
  M109 S{probe_temp}

  # Allow the bed, hotend, gantry, and probe mount to stabilize.
  G4 P300000

  LEVEL_Z
  BED_MESH_CLEAR
  BASE_BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=mybedmesh
  BED_MESH_PROFILE REMOVE=default
  SAVE_CONFIG

[gcode_macro LEVEL_Z]
description: Tram dual-Z gantry against fixed upper stops
gcode:
  # Save the active current before changing it.
  {% set saved_run = printer["tmc2209 stepper_z"].run_current|float %}
  {% set saved_hold = printer["tmc2209 stepper_z"].hold_current|float %}

  G90
  G28

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.250 HOLDCURRENT=0.250
  G4 P200
  G1 Z205.0 F600

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.150 HOLDCURRENT=0.150
  G4 P200
  G1 Z210.0 F120

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.250 HOLDCURRENT=0.250
  G4 P200
  G1 Z209.0 F120

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.150 HOLDCURRENT=0.150
  G4 P200
  G1 Z212.0 F120

  # Restore the current that was active at the start
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT={saved_run} HOLDCURRENT={saved_hold}
  G4 P200

  G1 Z30.0 F600
  G28

[gcode_macro START_PRINT]
description: Prepare a heated, trammed, meshed printer for a material-specific print
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(190)|float %}
  {% set standby_temp = params.EXTRUDER_STANDBY_TEMP|default(150)|float %}
  {% set pa = params.PA|default(0.13)|float %}

  BED_MESH_CLEAR
  M140 S{bed_temp}
  M104 S{standby_temp}
  M190 S{bed_temp}
  M109 S{standby_temp}

  LEVEL_Z
  BED_MESH_PROFILE LOAD=mybedmesh
  SET_PRESSURE_ADVANCE ADVANCE={pa}

  G90
  G92 E0
  M109 S{extruder_temp}
  PRIME_LINE

[gcode_macro PRIME_LINE]
description: Purge the nozzle at the front edge before printing
gcode:
  SAVE_GCODE_STATE NAME=prime_line_state
  G90
  M83

  G1 X2.0 Y5.0 Z0.24 F5000
  G1 X2.0 Y200.0 Z0.24 F1500 E15
  G1 X2.5 Y200.0 Z0.24 F5000
  G1 X2.5 Y5.0 Z0.24 F1500 E30

  G1 Z2.0 F3000

  RESTORE_GCODE_STATE NAME=prime_line_state

[gcode_macro END_PRINT]
description: Park the toolhead and leave Z energized after a completed print
gcode:
  M400
  G92 E0
  G91
  M83
  G1 E-2 F2700
  G1 E-2 Z2 F2400

  TURN_OFF_HEATERS
  M107

  G90
  G1 X4 Y200 F6000

  # Keep Z energized so the mechanically trammed gantry cannot drop while cooling.
  M84 X Y E

[gcode_macro CHANGE_FILAMENT]
description: Pause an active print and move the toolhead to the filament service position
variable_enabled: 0
gcode:
  {% set x = params.X|default(10)|float %}
  {% set y = params.Y|default(10)|float %}
  {% set z = params.Z|default(10)|float %}

  {% if printer["gcode_macro CHANGE_FILAMENT"].enabled|int %}
    PAUSE
    G91
    M83
    G1 E-0.8 F2700
    G1 Z{z} F900
    G90
    G1 X{x} Y{y} F3000
    M83
    G1 E-50 F1000
  {% endif %}

  SET_GCODE_VARIABLE MACRO=CHANGE_FILAMENT VARIABLE=enabled VALUE=0

[gcode_macro M600]
description: Start the configured filament-change sequence during a print
gcode:
  SET_GCODE_VARIABLE MACRO=CHANGE_FILAMENT VARIABLE=enabled VALUE=1

  {% if 'virtual_sdcard' in printer and printer.virtual_sdcard.progress %}
    CHANGE_FILAMENT
  {% else %}
    {action_respond_info("Filament change requested outside an active virtual-SD print")}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat the nozzle and move to the service position before manual filament insertion
gcode:
  {% set temp = params.TEMP|default(220)|float %}

  M109 S{temp}
  G90
  G28
  G1 Z10 F600
  G1 X125 Y50 F6000

  M117 Insert filament, then run LOAD_FILAMENT_FEED
  RESPOND TYPE=command MSG="Insert filament, then run LOAD_FILAMENT_FEED"

[gcode_macro LOAD_FILAMENT_FEED]
description: Feed manually inserted filament through the direct-drive extruder and purge the nozzle
gcode:
  {% set feed = params.FEED|default(40)|float %}
  {% set purge = params.PURGE|default(10)|float %}

  {% if not printer.extruder.can_extrude %}
    {action_raise_error("Hotend is below min_extrude_temp")}
  {% endif %}

  SAVE_GCODE_STATE NAME=load_filament_feed_state
  M83
  G1 E{feed} F1200
  G1 E{purge} F300
  RESTORE_GCODE_STATE NAME=load_filament_feed_state

[gcode_macro UNLOAD_FILAMENT]
description: Heat the nozzle and retract filament from the direct-drive extruder
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set distance = params.DISTANCE|default(80)|float %}

  M109 S{temp}
  G90
  G28
  G1 Z10 F600
  G1 X125 Y50 F6000

  SAVE_GCODE_STATE NAME=unload_filament_state
  M83
  G1 E-{distance} F2000
  RESTORE_GCODE_STATE NAME=unload_filament_state

#####################################################################
# Axis Twist Compensation
#
## How to use:
## 1. Run AXIS_TWIST_CALIBRATE_X - lower head unitl it grips the paper
## 2. Run AXIS_TWIST_CALIBRATE_Y - lower head unitl it grips the paper
## 3. Run AXIS_TWIST_SAVE
## 4. Run G29 to level mesh
#####################################################################

[gcode_macro AXIS_TWIST_CALIBRATE_X]
description: Calibrate X-axis twist compensation
gcode:
    {% if printer.manual_probe.is_active %}
        {action_raise_error("A manual probe is already active")}
    {% else %}
        M117 Axis Twist X
        RESPOND PREFIX=AXIS_TWIST MSG="Starting X-axis calibration."

        G28
        AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=X SAMPLE_COUNT=7
    {% endif %}


[gcode_macro AXIS_TWIST_CALIBRATE_Y]
description: Calibrate Y-axis twist compensation
gcode:
    {% if printer.manual_probe.is_active %}
        {action_raise_error("A manual probe is already active")}
    {% else %}
        M117 Axis Twist Y
        RESPOND PREFIX=AXIS_TWIST MSG="Starting Y-axis calibration."

        G28
        AXIS_TWIST_COMPENSATION_CALIBRATE AXIS=Y SAMPLE_COUNT=7
    {% endif %}


[gcode_macro AXIS_TWIST_SAVE]
description: Save X/Y Axis Twist calibration data
gcode:
    {% if printer.manual_probe.is_active %}
        {action_raise_error("Finish or abort the active manual probe first")}
    {% else %}
        M117 Saving Axis Twist
        RESPOND PREFIX=AXIS_TWIST MSG="Saving X/Y Axis Twist data."
        SAVE_CONFIG
    {% endif %}

[gcode_macro PROBE_STABILITY_TEST]
description: Probe multiple points and revisit a reference point after XY moves
gcode:
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set probe_temp = params.PROBE_TEMP|default(150)|float %}
    {% set samples = params.SAMPLES|default(10)|int %}

    M117 Preparing probe test
    RESPOND PREFIX=PROBE_TEST MSG="Heating bed to {bed_temp}C and nozzle to {probe_temp}C."

    M140 S{bed_temp}
    M104 S{probe_temp}
    M190 S{bed_temp}
    M109 S{probe_temp}

    G4 P300000

    G90
    G28
    BED_MESH_CLEAR

    # ---------------------------------------------------------------
    # Reference A: probe coordinate approximately X=60, Y=117.5
    # Nozzle coordinate X=1, Y=118.5
    # ---------------------------------------------------------------

    RESPOND PREFIX=PROBE_TEST MSG="A1: left-center reference"
    G1 Z10 F600
    G1 X1 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # ---------------------------------------------------------------
    # Point B: probe coordinate approximately X=215, Y=117.5
    # Nozzle coordinate X=156, Y=118.5
    # ---------------------------------------------------------------

    RESPOND PREFIX=PROBE_TEST MSG="B: right-center"
    G1 Z10 F600
    G1 X156 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # Return to reference A
    RESPOND PREFIX=PROBE_TEST MSG="A2: left-center after right move"
    G1 Z10 F600
    G1 X1 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # ---------------------------------------------------------------
    # Point C: front-center
    # Probe approximately X=137.5, Y=21
    # Nozzle approximately X=78.5, Y=22
    # ---------------------------------------------------------------

    RESPOND PREFIX=PROBE_TEST MSG="C: front-center"
    G1 Z10 F600
    G1 X78.5 Y22 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # Return to reference A
    RESPOND PREFIX=PROBE_TEST MSG="A3: left-center after front move"
    G1 Z10 F600
    G1 X1 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # ---------------------------------------------------------------
    # Point D: rear-center
    # Probe approximately X=137.5, Y=214
    # Nozzle approximately X=78.5, Y=215
    # ---------------------------------------------------------------

    RESPOND PREFIX=PROBE_TEST MSG="D: rear-center"
    G1 Z10 F600
    G1 X78.5 Y215 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # Return to reference A
    RESPOND PREFIX=PROBE_TEST MSG="A4: left-center after rear move"
    G1 Z10 F600
    G1 X1 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # ---------------------------------------------------------------
    # Point E: center
    # Probe approximately X=137.5, Y=117.5
    # Nozzle approximately X=78.5, Y=118.5
    # ---------------------------------------------------------------

    RESPOND PREFIX=PROBE_TEST MSG="E: center"
    G1 Z10 F600
    G1 X78.5 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    # Final return to reference A
    RESPOND PREFIX=PROBE_TEST MSG="A5: final left-center reference"
    G1 Z10 F600
    G1 X1 Y118.5 F3000
    G1 Z5 F600
    PROBE_ACCURACY PROBE_SPEED=5 LIFT_SPEED=10 SAMPLES={samples}

    G1 Z10 F600
    M117 Probe test complete
    RESPOND PREFIX=PROBE_TEST MSG="Test complete. Compare A1, A2, A3, A4, and A5 averages."

#####################################################################
# Menu
#####################################################################

[menu __main __octoprint __m600_paused]
type: list
enable: {printer.pause_resume.is_paused}
name: Filament Swap

[menu __main __octoprint __m600_paused __resume]
type: command
name: Resume
gcode:
  RESUME

[menu __main __octoprint __m600_paused __feed]
type: input
name: Feed: {'%.1f' % menu.input}
input: 25
input_step: 0.1
gcode:
  SAVE_GCODE_STATE NAME=filament_menu_feed_state
  M83
  G1 E{'%.1f' % menu.input} F60
  RESTORE_GCODE_STATE NAME=filament_menu_feed_state