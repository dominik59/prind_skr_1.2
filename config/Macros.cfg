#####################################################################
# Macros
#####################################################################

[gcode_macro G29]
description: Heat the printer and create the saved mybedmesh profile
gcode:
  BED_MESH_CALIBRATE {rawparams}

[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BASE_BED_MESH_CALIBRATE
description: Create mybedmesh after the printer reaches calibration temperature
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set probe_temp = params.PROBE_TEMP|default(150)|float %}

  M140 S{bed_temp}
  M104 S{probe_temp}
  M190 S{bed_temp}
  M109 S{probe_temp}

  LEVEL_Z
  BED_MESH_CLEAR
  BASE_BED_MESH_CALIBRATE
  BED_MESH_PROFILE SAVE=mybedmesh
  BED_MESH_PROFILE REMOVE=default
  SAVE_CONFIG

[gcode_macro LEVEL_Z]
description: Tram the dual-Z gantry against fixed upper stops before final homing
gcode:
  G90
  G28

  # Reduced torque lets the fixed upper stops mechanically equalize both Z sides.
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.250 HOLDCURRENT=0.250
  G1 Z205.0 F1000
  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.002 HOLDCURRENT=0.002
  G1 Z210.0 F300

  SET_TMC_CURRENT STEPPER=stepper_z CURRENT=0.580 HOLDCURRENT=0.580
  G1 Z30.0 F1000
  G28
  INIT_TMC STEPPER=stepper_z
  G90

[gcode_macro START_PRINT]
description: Prepare a heated, trammed, meshed printer for a material-specific print
gcode:
  {% set bed_temp = params.BED_TEMP|default(60)|float %}
  {% set extruder_temp = params.EXTRUDER_TEMP|default(190)|float %}
  {% set standby_temp = params.EXTRUDER_STANDBY_TEMP|default(150)|float %}
  {% set pa = params.PA|default(0.13)|float %}

  BED_MESH_CLEAR
  M140 S{bed_temp}
  M104 S{standby_temp}
  M190 S{bed_temp}
  M109 S{standby_temp}

  LEVEL_Z
  BED_MESH_PROFILE LOAD=mybedmesh
  SET_PRESSURE_ADVANCE ADVANCE={pa}

  G90
  G92 E0
  M109 S{extruder_temp}
  PRIME_LINE

[gcode_macro PRIME_LINE]
description: Purge the nozzle at the front edge before printing
gcode:
  SAVE_GCODE_STATE NAME=prime_line_state
  G90
  M83

  G1 X1.1 Y100.0 Z0.3 F1200.0 E15
  G1 X1.4 Y100.0 Z0.3 F5000.0
  G1 X1.4 Y20.0 Z0.3 F1500.0 E15
  G1 Z2.0 F3000

  RESTORE_GCODE_STATE NAME=prime_line_state

[gcode_macro END_PRINT]
description: Park the toolhead and leave Z energized after a completed print
gcode:
  M400
  G92 E0
  G91
  M83
  G1 E-2 F2700
  G1 E-2 Z2 F2400

  TURN_OFF_HEATERS
  M107

  G90
  G1 X4 Y200 F6000

  # Keep Z energized so the mechanically trammed gantry cannot drop while cooling.
  M84 X Y E

[gcode_macro CHANGE_FILAMENT]
description: Pause an active print and move the toolhead to the filament service position
variable_enabled: 0
gcode:
  {% set x = params.X|default(10)|float %}
  {% set y = params.Y|default(10)|float %}
  {% set z = params.Z|default(10)|float %}

  {% if printer["gcode_macro CHANGE_FILAMENT"].enabled|int %}
    PAUSE
    G91
    M83
    G1 E-0.8 F2700
    G1 Z{z} F900
    G90
    G1 X{x} Y{y} F3000
    M83
    G1 E-50 F1000
  {% endif %}

  SET_GCODE_VARIABLE MACRO=CHANGE_FILAMENT VARIABLE=enabled VALUE=0

[gcode_macro M600]
description: Start the configured filament-change sequence during a print
gcode:
  SET_GCODE_VARIABLE MACRO=CHANGE_FILAMENT VARIABLE=enabled VALUE=1

  {% if 'virtual_sdcard' in printer and printer.virtual_sdcard.progress %}
    CHANGE_FILAMENT
  {% else %}
    {action_respond_info("Filament change requested outside an active virtual-SD print")}
  {% endif %}

[gcode_macro LOAD_FILAMENT]
description: Heat the nozzle and move to the service position before manual filament insertion
gcode:
  {% set temp = params.TEMP|default(220)|float %}

  M109 S{temp}
  G90
  G28
  G1 Z10 F600
  G1 X125 Y50 F6000

  M117 Insert filament, then run LOAD_FILAMENT_FEED
  RESPOND TYPE=command MSG="Insert filament, then run LOAD_FILAMENT_FEED"

[gcode_macro LOAD_FILAMENT_FEED]
description: Feed manually inserted filament through the direct-drive extruder and purge the nozzle
gcode:
  {% set feed = params.FEED|default(40)|float %}
  {% set purge = params.PURGE|default(10)|float %}

  {% if not printer.extruder.can_extrude %}
    {action_raise_error("Hotend is below min_extrude_temp")}
  {% endif %}

  SAVE_GCODE_STATE NAME=load_filament_feed_state
  M83
  G1 E{feed} F1200
  G1 E{purge} F300
  RESTORE_GCODE_STATE NAME=load_filament_feed_state

[gcode_macro UNLOAD_FILAMENT]
description: Heat the nozzle and retract filament from the direct-drive extruder
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set distance = params.DISTANCE|default(80)|float %}

  M109 S{temp}
  G90
  G28
  G1 Z10 F600
  G1 X125 Y50 F6000

  SAVE_GCODE_STATE NAME=unload_filament_state
  M83
  G1 E-{distance} F2000
  RESTORE_GCODE_STATE NAME=unload_filament_state

#####################################################################
# Menu
#####################################################################

[menu __main __octoprint __m600_paused]
type: list
enable: {printer.pause_resume.is_paused}
name: Filament Swap

[menu __main __octoprint __m600_paused __resume]
type: command
name: Resume
gcode:
  RESUME

[menu __main __octoprint __m600_paused __feed]
type: input
name: Feed: {'%.1f' % menu.input}
input: 25
input_step: 0.1
gcode:
  SAVE_GCODE_STATE NAME=filament_menu_feed_state
  M83
  G1 E{'%.1f' % menu.input} F60
  RESTORE_GCODE_STATE NAME=filament_menu_feed_state